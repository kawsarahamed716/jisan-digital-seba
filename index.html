
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JISAN DIGITAL SEBA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f7f2;color:#173c2a}
header{background:#087443;color:white;text-align:center;padding:22px 10px}
main{max-width:1100px;margin:auto;padding:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.service{background:white;padding:15px;border-radius:12px;border:1px solid #d5e8db}
button{background:#087443;color:white;border:0;padding:11px 15px;border-radius:7px;cursor:pointer}
input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #bbb;border-radius:7px;font-size:16px}
label{font-weight:bold}
#formArea{background:white;padding:18px;border-radius:12px;margin-top:20px}
.hidden{display:none}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
@media print{header,.grid,.no-print{display:none!important}body{background:white}}
</style>
</head>
<body>
<header>
<h1>🌿 JISAN DIGITAL SEBA</h1>
<p>নাগরিক সেবা — এক জায়গায়, সহজ বাংলায়</p>
</header>
<main>
<h2>আমাদের ২১টি সেবা</h2>
<div class="grid" id="services"></div>
<section id="formArea" class="hidden">
<h2 id="formTitle"></h2>
<form id="serviceForm">
<div id="fields"></div>
<button type="button" onclick="window.print()" class="no-print">প্রিন্ট / PDF সংরক্ষণ</button>
<button type="reset" class="no-print">ফর্ম মুছুন</button>
</form>
<p>এটি আবেদন প্রস্তুতির সহায়ক ফর্ম, সরকারি আবেদন জমা দেওয়ার ফর্ম নয়।</p>
</section>
</main>
<script>
const divisions={
"ঢাকা বিভাগ":["ঢাকা","ফরিদপুর","গাজীপুর","গোপালগঞ্জ","কিশোরগঞ্জ","মাদারীপুর","মানিকগঞ্জ","মুন্সীগঞ্জ","নারায়ণগঞ্জ","নরসিংদী","রাজবাড়ী","শরীয়তপুর","টাঙ্গাইল"],
"চট্টগ্রাম বিভাগ":["বান্দরবান","ব্রাহ্মণবাড়িয়া","চাঁদপুর","চট্টগ্রাম","কুমিল্লা","কক্সবাজার","ফেনী","খাগড়াছড়ি","লক্ষ্মীপুর","নোয়াখালী","রাঙ্গামাটি"],
"রাজশাহী বিভাগ":["বগুড়া","জয়পুরহাট","নওগাঁ","নাটোর","চাঁপাইনবাবগঞ্জ","পাবনা","রাজশাহী","সিরাজগঞ্জ"],
"খুলনা বিভাগ":["বাগেরহাট","চুয়াডাঙ্গা","যশোর","ঝিনাইদহ","খুলনা","কুষ্টিয়া","মাগুরা","মেহেরপুর","নড়াইল","সাতক্ষীরা"],
"বরিশাল বিভাগ":["বরগুনা","বরিশাল","ভোলা","ঝালকাঠি","পটুয়াখালী","পিরোজপুর"],
"সিলেট বিভাগ":["হবিগঞ্জ","মৌলভীবাজার","সুনামগঞ্জ","সিলেট"],
"রংপুর বিভাগ":["দিনাজপুর","গাইবান্ধা","কুড়িগ্রাম","লালমনিরহাট","নীলফামারী","পঞ্চগড়","রংপুর","ঠাকুরগাঁও"],
"ময়মনসিংহ বিভাগ":["জামালপুর","ময়মনসিংহ","নেত্রকোণা","শেরপুর"]
};

const services=[
"জন্ম নিবন্ধন","মৃত্যু নিবন্ধন","জাতীয় পরিচয়পত্র","নাগরিকত্ব সনদ",
"স্থায়ী বাসিন্দা সনদ","চারিত্রিক সনদ","অবিবাহিত সনদ","ওয়ারিশ সনদ",
"পারিবারিক সনদ","আয় সনদ","ভূমিহীন সনদ","প্রতিবন্ধী ভাতা",
"বয়স্ক ভাতা","বিধবা ভাতা","শিক্ষা উপবৃত্তি","ই-পাসপোর্ট",
"পুলিশ ক্লিয়ারেন্স","ট্রেড লাইসেন্স","ভূমি সেবা","e-TIN","অনলাইন আবেদন সহায়তা"
];

const servicesBox=document.getElementById("services");
services.forEach((name,i)=>{
 const card=document.createElement("div");
 card.className="service";
 card.innerHTML=`<b>${i+1}. ${name}</b><p>আবেদন প্রস্তুতির ফর্ম পূরণ করুন</p><button type="button">ফর্ম খুলুন</button>`;
 card.querySelector("button").onclick=()=>openForm(name);
 servicesBox.appendChild(card);
});

function openForm(name){
 document.getElementById("formArea").classList.remove("hidden");
 document.getElementById("formTitle").textContent=name+" — আবেদন প্রস্তুতি ফর্ম";
 const fields=document.getElementById("fields");
 fields.innerHTML="";
 const common=[
 ["আবেদনকারীর পূর্ণ নাম","text"],
 ["ইংরেজি নাম","text"],
 ["পিতার নাম","text"],
 ["মাতার নাম","text"],
 ["জন্ম তারিখ","date"],
 ["মোবাইল নম্বর","tel"],
 ["গ্রাম / মহল্লা","text"],
 ["ডাকঘর","text"]
 ];
 common.forEach(([label,type])=>addInput(fields,label,type));

 addSelect(fields,"বিভাগ",Object.keys(divisions),"division");
 addSelect(fields,"জেলা",[],"district");

 const division=fields.querySelector('[name="division"]');
 const district=fields.querySelector('[name="district"]');
 division.onchange=()=>{
  district.innerHTML='<option value="">জেলা নির্বাচন করুন</option>';
  (divisions[division.value]||[]).forEach(d=>{
   district.add(new Option(d,d));
  });
 };

 addInput(fields,"উপজেলা / থানা","text");
 addInput(fields,"ইউনিয়ন / পৌরসভা / সিটি কর্পোরেশন","text");
 addInput(fields,"ওয়ার্ড নম্বর","text");
 addInput(fields,"বিস্তারিত ঠিকানা","textarea");
 addInput(fields,"প্রয়োজনীয় অতিরিক্ত তথ্য","textarea");

 if(name==="জন্ম নিবন্ধন"){
  addInput(fields,"শিশুর বাংলা নাম","text");
  addInput(fields,"শিশুর ইংরেজি নাম","text");
  addInput(fields,"জন্মস্থান","text");
  addInput(fields,"লিঙ্গ","text");
  addInput(fields,"পিতার ইংরেজি নাম","text");
  addInput(fields,"মাতার ইংরেজি নাম","text");
 }
 if(name==="মৃত্যু নিবন্ধন"){
  addInput(fields,"মৃত ব্যক্তির নাম","text");
  addInput(fields,"মৃত্যুর তারিখ","date");
  addInput(fields,"মৃত্যুর স্থান","text");
 }
 if(name==="ই-পাসপোর্ট"){
  addInput(fields,"পাসপোর্টের ধরন","text");
  addInput(fields,"পেশা","text");
 }
 if(name==="ট্রেড লাইসেন্স"){
  addInput(fields,"প্রতিষ্ঠানের নাম","text");
  addInput(fields,"ব্যবসার ধরন","text");
 }
 if(name.includes("ভাতা")){
  addInput(fields,"জাতীয় পরিচয়পত্র নম্বর (নিজে লিখুন/প্রিন্টের জন্য)","text");
  addInput(fields,"মাসিক আয়","text");
 }
 if(name==="e-TIN"){
  addInput(fields,"করদাতার নাম","text");
  addInput(fields,"পেশা","text");
 }
 addInput(fields,"আবেদনকারীর স্বাক্ষর","text");
 document.getElementById("formArea").scrollIntoView({behavior:"smooth"});
}

function addInput(parent,label,type){
 const wrap=document.createElement("div");
 const safeLabel=label.replace(/&/g,"&amp;").replace(/</g,"&lt;");
 wrap.innerHTML=`<label>${safeLabel}</label>`;
 const el=type==="textarea"?document.createElement("textarea"):document.createElement("input");
 if(type!=="textarea")el.type=type;
 el.name=label;
 wrap.appendChild(el);
 parent.appendChild(wrap);
}
function addSelect(parent,label,options,name){
 const wrap=document.createElement("div");
 wrap.innerHTML=`<label>${label}</label>`;
 const select=document.createElement("select");
 select.name=name;
 select.add(new Option("নির্বাচন করুন",""));
 options.forEach(v=>select.add(new Option(v,v)));
 wrap.appendChild(select);
 parent.appendChild(wrap);
}
</script>
</body>
</html>
